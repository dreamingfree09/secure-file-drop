<!doctype html><meta charset="utf-8"><title>Owned Secure File Drop browser acceptance</title><p id="result">RUNNING</p><iframe id="app" src="/"></iframe><script>
const fixture = __FIXTURE__;
document.currentScript.remove();
let running=false;
const frame=document.getElementById('app');
frame.onload=async()=>{
 if(running)return;running=true;
 try{
  const win=frame.contentWindow,doc=win.document;
  doc.getElementById('username').value=fixture.username;
  doc.getElementById('password').value=fixture.password;
  await win.login();
  const me=await fetch('/me');const user=await me.json();
  if(me.status!==200||user.username!==fixture.username||!user.is_admin)throw Error('identity');
  if(doc.getElementById('appScreen').classList.contains('hidden')||doc.getElementById('adminSection').style.display!=='block')throw Error('browser state');
  if((await fetch('/ready')).status!==200||(await fetch('/admin/files')).status!==200)throw Error('readiness');
  if((await fetch('/logout',{method:'POST'})).status!==200||(await fetch('/me')).status!==401)throw Error('logout');
  doc.getElementById('password').value='';frame.remove();document.getElementById('result').textContent='BROWSER ACCEPTANCE PASS: real historical UI login, admin identity, readiness, permission and logout; normal HTTPS';
 }catch(e){frame.remove();document.getElementById('result').textContent='BROWSER ACCEPTANCE FAIL';}
};
</script>
