name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Go, native and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Browser-script session unit tests
        run: node --test tests/web/*.test.cjs
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Native SHA-256 vectors
        run: make -C native test
      - name: Unit tests (full-stack test explicitly skipped here)
        run: go test ./... -v -count=1 -coverprofile=coverage.out
      - name: Vet and backend build
        run: |
          go vet ./...
          go build -o /tmp/sfd-backend ./cmd/backend
      - name: Race checks
        run: go test -race ./internal/... ./cmd/... -count=1
      - name: Dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout 5m
  docs-link-check:
    name: Local documentation targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-doc-links.py
  e2e-tests:
    name: Real container upload, native hash and signed download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Full-stack acceptance (no skipped Docker tests)
        env:
          SFD_E2E: '1'
        run: go test ./tests/e2e -v -count=1 -timeout 25m
