name: Synthetic PKI preparation
on:
  push:
    branches:
      - 'codex/sfd-ca-transition-implementation-*'
  pull_request:
    paths:
      - 'tools/pki-transition-implementation/**'
      - '.github/workflows/pki-preparation.yml'
permissions:
  contents: read
jobs:
  disposable-linux-pki:
    name: Disposable issuer, custody and publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exact vendor fixture toolchain on disposable hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y openssl=3.0.13-0ubuntu3.16 libssl3t64=3.0.13-0ubuntu3.16
      - name: Pinned synthetic issuer and negative regressions
        run: python3 -I -B tools/pki-transition-implementation/test_linux.py
      - name: Public synthetic result only
        if: always()
        run: |
          if test -f tools/pki-transition-implementation/linux-results.json; then
            cat tools/pki-transition-implementation/linux-results.json
          fi
