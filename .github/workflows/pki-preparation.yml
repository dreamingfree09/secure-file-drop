name: Synthetic PKI preparation
on:
  push:
    branches:
      - 'codex/sfd-ca-transition-implementation-*'
      - 'codex/sfd-pki-completion-preparation-*'
  pull_request:
    paths:
      - 'tools/pki-transition-implementation/**'
      - '.github/workflows/pki-preparation.yml'
permissions:
  contents: read
jobs:
  disposable-linux-pki:
    name: Disposable issuer, archive, custody and publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exact vendor fixture toolchain on disposable hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y openssl=3.0.13-0ubuntu3.16 libssl3t64=3.0.13-0ubuntu3.16
      - name: Pinned synthetic regressions
        run: |
          python3 -I -B tools/pki-transition-implementation/test_linux.py
          python3 -I -B tools/pki-transition-implementation/test_archive_recovery.py
          python3 -I -B tools/pki-transition-implementation/test_publisher_recovery.py
          python3 -I -B tools/pki-transition-implementation/test_readiness.py
      - name: Export public synthetic chain packet only
        run: |
          python3 -I -B tools/pki-transition-implementation/make_public_packet.py > packet-path.txt
          mkdir -p public-packet
          packet="$(cat packet-path.txt)"
          cp "$packet"/*.der "$packet"/packet.json public-packet/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-public-chain-packet
          path: public-packet/
          retention-days: 3
          if-no-files-found: error
      - name: Public synthetic results only
        if: always()
        run: |
          for name in linux archive publisher-recovery readiness; do
            if test -f "tools/pki-transition-implementation/$name-results.json"; then
              cat "tools/pki-transition-implementation/$name-results.json"
            fi
          done
  disposable-windows-memory:
    name: Memory-only Windows revocation and local input
    needs: disposable-linux-pki
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synthetic-public-chain-packet
          path: public-packet/
      - name: Build the Framework 4.8 fixture probes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64/v4.0.30319/csc.exe'
          $src=(Resolve-Path -LiteralPath 'tools\pki-transition-implementation').Path
          & $csc /nologo /target:exe /r:System.Web.Extensions.dll /out:MemoryChainFixture.exe (Join-Path $src "MemoryChainFixture.cs")
          if($LASTEXITCODE-ne0){throw 'Memory probe build failed'}
          & $csc /nologo /target:exe /r:System.Web.Extensions.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:SecretEntryFixture.exe (Join-Path $src "SecretEntryFixture.cs")
          if($LASTEXITCODE-ne0){throw 'Input probe build failed'}
          Copy-Item -LiteralPath (Join-Path $src "FixtureWindows.exe.config") -Destination MemoryChainFixture.exe.config
          Copy-Item -LiteralPath (Join-Path $src "FixtureWindows.exe.config") -Destination SecretEntryFixture.exe.config
      - name: Memory-exclusive trust, revocation and synthetic local-input tests
        shell: pwsh
        run: |
          python -I -B tools/pki-transition-implementation/test_memory_chain.py "$PWD/MemoryChainFixture.exe" "$PWD/public-packet"
          if($LASTEXITCODE-ne0){throw 'Memory chain cases failed'}
          python -I -B tools/pki-transition-implementation/test_secret_entry.py "$PWD/SecretEntryFixture.exe"
          if($LASTEXITCODE-ne0){throw 'Input cases failed'}
          Get-Content tools/pki-transition-implementation/memory-chain-results.json
          Get-Content tools/pki-transition-implementation/secret-results.json
