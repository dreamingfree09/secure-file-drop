name: Operator acceptance proposal checks
on:
  pull_request:
    paths:
      - 'tools/operator-acceptance/**'
      - 'tools/operator-controller/**'
      - 'scripts/test-operator-controller.py'
      - '.github/workflows/operator-acceptance.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    paths:
      - 'tools/operator-acceptance/**'
      - 'tools/operator-controller/**'
      - 'scripts/test-operator-controller.py'
      - '.github/workflows/operator-acceptance.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  isolated-account-guards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d4c3314b2dd74ff23cd6cd07e4d7e737cb6ef791c22a7cbd744cfbfb4815df72
        env:
          POSTGRES_USER: fixture
          POSTGRES_DB: sfd_acceptance_fixture_0123456789ab
          POSTGRES_PASSWORD: isolated-ci-fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture -d sfd_acceptance_fixture_0123456789ab"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/operator-acceptance/account/go.mod
      - name: Staged workflow security regressions
        run: python3 -B -m unittest discover -s tools/operator-acceptance -p test_staged_account.py -v
      - name: Real isolated PostgreSQL quota and rollback guards
        env:
          SFD_ACCEPTANCE_TEST_DSN: postgres://fixture:isolated-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/sfd_acceptance_fixture_0123456789ab?sslmode=disable
        working-directory: tools/operator-acceptance/account
        run: go test -race ./... -v -count=1
      - name: Operator vet
        working-directory: tools/operator-acceptance/account
        run: go vet ./...

  isolated-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/operator-controller/probe/go.mod
      - name: Pull pinned synthetic storage
        run: docker pull minio/minio@sha256:4092433a77e510826874b36f369696df43407a763d7f901a61d74e83e6fd95bc
      - name: Controller failure guards and real isolated probe
        run: >-
          python3 -B scripts/test-operator-controller.py
          --storage-image minio/minio@sha256:4092433a77e510826874b36f369696df43407a763d7f901a61d74e83e6fd95bc
          --output "$RUNNER_TEMP/controller-evidence"
      - name: Configured nested probe lint
        working-directory: tools/operator-controller/probe
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run --config ../../../.golangci.yml ./...
      - name: Reachable nested probe vulnerability check
        working-directory: tools/operator-controller/probe
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Retain sanitised synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: one-use-controller-evidence
          path: ${{ runner.temp }}/controller-evidence
          if-no-files-found: error
