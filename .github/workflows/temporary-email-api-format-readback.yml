name: Temporary email API source format readback
on:
  push:
    branches: [feature/recipient-passcode-delivery-20261103]
    paths: [.github/workflows/temporary-email-api-format-readback.yml]
permissions:
  contents: read
jobs:
  gofmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply gofmt to disposable hosted copy and emit exact source bytes
        run: |
          for path in internal/server/email.go internal/server/email_api_test.go internal/server/config_validation.go internal/server/register.go internal/server/recipient_delivery.go; do
            gofmt -w "$path"
            echo "SFD_EMAIL_FORMAT_BEGIN $path"
            base64 -w0 "$path"
            echo
            echo "SFD_EMAIL_FORMAT_END $path"
          done
