name: Temporary Railway privacy gofmt readback
on:
  push:
    branches: [fix/railway-staging-bucket-privacy-20261104]
    paths: [.github/workflows/temporary-sfd-railway-privacy-format.yml]
permissions:
  contents: read
jobs:
  format-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Format only new staging-source Go files in disposable runner
        run: |
          for path in internal/server/railway_storage_privacy.go internal/server/railway_storage_privacy_test.go internal/server/minio.go internal/server/config_validation.go; do
            gofmt -w "$path"
            echo "SFD_PRIVACY_FORMAT_BEGIN $path"
            base64 -w0 "$path"
            echo
            echo "SFD_PRIVACY_FORMAT_END $path"
          done
