name: Rorschach read-only preflight

on:
  push:
    paths:
      - 'scripts/rorschach_preflight.py'
      - 'tests/rorschach/**'
      - '.github/workflows/rorschach-preflight.yml'
  pull_request:
    paths:
      - 'scripts/rorschach_preflight.py'
      - 'tests/rorschach/**'
      - '.github/workflows/rorschach-preflight.yml'

permissions:
  contents: read

jobs:
  preflight-safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Execute read-only and redaction regression tests
        run: python3 -B -m unittest discover -s tests/rorschach -p 'test_*.py' -v
