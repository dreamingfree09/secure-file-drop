name: Rorschach resumable upload acceptance
on:
  push:
    branches: [codex/rorschach-resumable-upload-20261108]
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/rorschach-resumable.yml'
      - 'deploy/rorschach/**'
      - 'internal/server/resumable_v2_*.go'
      - 'internal/db/migrations/*rorschach_resumable*'
      - 'tests/rorschach/**'
      - 'web/static/resumable-v2.js'
permissions:
  contents: read
jobs:
  resumable:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolated browser fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          npm ci --prefix tests/browser --ignore-scripts
          node tests/browser/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Real PostgreSQL, private RustFS and strict HTTPS with restart/recovery
        env:
          SFD_R2_HOSTED_FIXTURE: '1'
        run: bash tests/rorschach/run_compose_fixture.sh
