version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    revive:
      severity: warning
    misspell:
      locale: US
    gosec:
      excludes:
        - G104
  exclusions:
    generated: strict
    paths:
      - vendor
      - docs
      - tests/e2e

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
    paths:
      - vendor
      - docs
      - tests/e2e

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
